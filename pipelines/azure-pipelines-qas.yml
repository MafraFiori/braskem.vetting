trigger:
  branches:
    include:
      - homolog
  paths:
    exclude:
      - /pipelines

pool:
  vmImage: ubuntu-latest

resources:
  repositories:
  - repository: templates
    type: git
    name: DevChapter/pipelines-templates
    ref: refs/tags/v2

steps:
- checkout: self

- template: templates/btp-node.yaml@templates
  parameters:
    cfOrg: "$(CF-ORG-QAS)"
    cfSpace: "Vetting-QAS"
