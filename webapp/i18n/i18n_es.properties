questionnaire.q8_11_1=8.11.1. Indique si hay v\u00e1lvulas de retenci\u00f3n individuales instaladas en cada l\u00ednea de vapores de los tanques de carga para evitar el reflujo y la contaminaci\u00f3n de la carga durante las operaciones.
questionnaire.q8_12=8.12. \u00bfCu\u00e1l es el caudal m\u00e1ximo de descarga para una carga homog\u00e9nea a trav\u00e9s de una l\u00ednea com\u00fan? (m\u00b3/h)
questionnaire.q8_13=8.13. \u00bfCu\u00e1l es la presi\u00f3n m\u00e1xima de descarga en el manifold utilizando una l\u00ednea com\u00fan (kgf/cm\u00b2)? \u00bfCu\u00e1l es la presi\u00f3n normal de operaci\u00f3n de descarga en el manifold utilizando una l\u00ednea com\u00fan (kgf/cm\u00b2)?
