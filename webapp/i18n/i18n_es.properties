questionnaire.q8_14d=d) \u00bfLos oficiales conocen los ajustes de las v\u00e1lvulas?
questionnaire.q8_14e=e) \u00bfLos oficiales saben c\u00f3mo cerrar o aislar las v\u00e1lvulas en caso de emergencia?

#QUESTIONNAIRE - 9. PROCEDURES AND MANUALS
questionnaire.section9=9. Procedimientos y Manuales
questionnaire.q9_1=9.1. \u00bfEl buque dispone a bordo de procedimientos escritos para la navegaci\u00f3n mar\u00edtima e interior, seg\u00fan corresponda, de acuerdo con los requisitos de la OMI?
questionnaire.q9_2=9.2. \u00bfEl buque dispone de procedimientos escritos para la entrada segura en espacios potencialmente peligrosos, como c\u00e1maras de bombas de carga, tanques de carga y coferdanes, de acuerdo con las directrices del ISGOTT?
questionnaire.q9_3=9.3. \u00bfHay procedimientos claros de manejo de carga y lastre disponibles a bordo?
questionnaire.q9_4=9.4. \u00bfHay manuales de navegaci\u00f3n, manejo de carga y prevenci\u00f3n de la contaminaci\u00f3n disponibles a bordo?
questionnaire.q9_5=9.5. \u00bfLa tripulaci\u00f3n conoce los peligros asociados a la limpieza de los tanques de carga y la toxicidad de los productos transportados?
questionnaire.q9_6=9.6. \u00bfLa tripulaci\u00f3n conoce los requisitos para el control de la atm\u00f3sfera de los tanques de carga durante las operaciones de limpieza de tanques?
questionnaire.q9_7=9.7. \u00bfLa tripulaci\u00f3n conoce los riesgos de la electricidad est\u00e1tica y las precauciones y procedimientos aplicables?

