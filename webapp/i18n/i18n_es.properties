questionnaire.remarks=<strong>Observaciones</strong>: Aunque este Cuestionario haya sido completado en su totalidad y el buque se encuentre al d\u00eda, considerando la validez de los informes presentados y el cumplimiento de todos los requisitos y normas, en cuanto a las licencias, certificados e informes de inspecci\u00f3n realizados seg\u00fan CDI, SIRE, OCIMF y Control del Estado Rector del Puerto, disponiendo adem\u00e1s de un Cuestionario de Vetting v\u00e1lido emitido por cualquier otra Empresa, el buque podr\u00e1 ser inspeccionado por el Equipo de Vetting de Braskem o por cualquier otro Inspector designado, a criterio de Braskem. Esta inspecci\u00f3n podr\u00e1 realizarse antes de la firma del contrato de fletamento, en cualquier lugar del mundo, o cuando el buque llegue a cualquier instalaci\u00f3n de Braskem para la primera escala operativa, mediante la verificaci\u00f3n del mantenimiento f\u00edsico y estructural de los equipos, de las condiciones de seguridad y operativas, as\u00ed como de la calificaci\u00f3n de la tripulaci\u00f3n. Los buques bajo contrato de terceros tambi\u00e9n podr\u00e1n ser inspeccionados por el Equipo de Vetting de Braskem, siguiendo los mismos criterios no solo para la inspecci\u00f3n, sino tambi\u00e9n para la aceptaci\u00f3n del buque para operar en las instalaciones de Braskem.

