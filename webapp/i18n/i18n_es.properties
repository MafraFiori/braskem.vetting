questionnaire.q7_2=7.2. \u00bfLas bombas de transferencia de carga, bombas de refuerzo, bombas de lastre, sistema de achique, compresores, escotillas de los tanques de carga, v\u00e1lvulas, tuber\u00edas y todos los dem\u00e1s equipos involucrados en la operaci\u00f3n se mantienen en condiciones satisfactorias?
questionnaire.q7_3=7.3. \u00bfTodos los cabos de amarre y chigres se mantienen en condiciones satisfactorias?
questionnaire.q7_4=7.4. \u00bfEl buque es capaz de operar en una monoboya (SPM) de acuerdo con la \u00faltima edici\u00f3n de las Directrices de Equipos de Amarre de OCIMF?
