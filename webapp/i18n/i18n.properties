questionnaire.remarks=<strong>Remarks</strong>: Although this Questionnaire has been absolutely filled out, and the vessel is showing to be up to date, taking into account the presented reports validity, and fitting with all requirements and rules, as for the licenses, certificates and Inspection reports carried out according to CDI, SIRE, OCIMF, Port State Control, possessing also a valid Vetting Questionnaire issued by any other Company, the vessel may be inspected by Braskem Vetting Team or by any other appointed Surveyor, according to Braskem discretion. This inspection can be carried out prior chartering contract signature at any place worldwide, or when the vessel arrives to any Braskem installation for the first operation call, by means of physical and structural equipment maintenance, safety and operational condition as well as crew qualification. Vessels under a third party contract may also be inspected by Braskem Vetting Team, following the same criteria not only for the inspection but also for the vessel acceptance to operate at Braskem installations.

