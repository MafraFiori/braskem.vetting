questionnaire.remarks=<strong>Observa\u00e7\u00f5es</strong>: Embora este Question\u00e1rio tenha sido integralmente preenchido e o navio se apresente em dia, considerando a validade dos relat\u00f3rios apresentados e o atendimento a todos os requisitos e normas, quanto \u00e0s licen\u00e7as, certificados e relat\u00f3rios de inspe\u00e7\u00e3o realizados segundo CDI, SIRE, OCIMF e Port State Control, possuindo tamb\u00e9m um Question\u00e1rio de Vetting v\u00e1lido emitido por qualquer outra Empresa, o navio poder\u00e1 ser inspecionado pela Equipe de Vetting da Braskem ou por qualquer outro Vistoriador designado, a crit\u00e9rio da Braskem. Essa inspe\u00e7\u00e3o poder\u00e1 ser realizada antes da assinatura do contrato de afretamento, em qualquer lugar do mundo, ou quando o navio chegar a qualquer instala\u00e7\u00e3o da Braskem para a primeira escala operacional, por meio da verifica\u00e7\u00e3o da manuten\u00e7\u00e3o f\u00edsica e estrutural dos equipamentos, das condi\u00e7\u00f5es de seguran\u00e7a e operacionais, bem como da qualifica\u00e7\u00e3o da tripula\u00e7\u00e3o. Navios sob contrato de terceiros tamb\u00e9m poder\u00e3o ser inspecionados pela Equipe de Vetting da Braskem, seguindo os mesmos crit\u00e9rios n\u00e3o apenas para a inspe\u00e7\u00e3o, mas tamb\u00e9m para a aceita\u00e7\u00e3o do navio para operar nas instala\u00e7\u00f5es da Braskem.

